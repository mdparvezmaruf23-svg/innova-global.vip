/* =========================================================
   INNOVA.GLOBAL DEMO DATABASE
========================================================= */

const DB_KEY = "INNOVA_GLOBAL_DATABASE_V3";

const PAYMENT_NUMBER = "01313213083";
const ACTIVATION_FEE = 200;

let db = JSON.parse(localStorage.getItem(DB_KEY));

if(!db){

    db = {
        members: [],
        requests: [],
        notifications: [],
        nextId: 1,
        currentMember: null
    };

}

function saveDB(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}

function makeID(number){

    return String(number).padStart(5,"0");

}

function getMember(id){

    return db.members.find(
        member => member.id === id
    );

}

function getActiveMember(id){

    const member = getMember(id);

    if(member && member.active){
        return member;
    }

    return null;

}

/* =========================================================
   REFERRAL SYSTEM
========================================================= */

function getReferralFromURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("ref") || "";

}


/*
    প্রত্যেক Active Member-এর নিজের Referral Link
*/

function getReferralLink(memberID){

    return window.location.origin +
           window.location.pathname +
           "?ref=" +
           encodeURIComponent(memberID);

}


/*
    Direct Partner
*/

function getDirectPartners(memberID){

    return db.members.filter(member =>
        member.active &&
        member.uplineID === memberID
    );

}


/*
    পুরো Team
*/

function getTeam(memberID){

    const team = [];

    function findChildren(parentID){

        const children =
            getDirectPartners(parentID);

        children.forEach(member => {

            team.push(member);

            findChildren(member.id);

        });

    }

    findChildren(memberID);

    return team;

}


/* =========================================================
   NOTIFICATION
========================================================= */

function addNotification(
    memberID,
    title,
    message
){

    db.notifications.unshift({

        id:Date.now(),

        memberID:memberID,

        title:title,

        message:message,

        read:false,

        date:new Date().toLocaleString("en-BD")

    });

}


/* =========================================================
   COMMON
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function logo(){

    return `
        <div class="logo">

            <b>INNOVA</b>

            <span>.GLOBAL</span>

        </div>
    `;

}

function backHome(){

    return `
        <button
            class="back"
            onclick="goHome()"
        >
            ← BACK
        </button>
    `;

}

function goHome(){

    history.replaceState(
        {},

        window.location.pathname

    home();

}

            >

/* =========================================================
   CREATE ACCOUNT
========================================================= */

function createAccount(){

    const name =
        document.getElementById("regName")
        .value.trim();

    const mobile =
        document.getElementById("regMobile")
        .value.trim();

    const password =
        document.getElementById("regPassword")
        .value;

    const password2 =
        document.getElementById("regPassword2")
        .value;

    const referralID =
        document.getElementById("regReferral")
        .value.trim();

    const message =
        document.getElementById(
            "registerMessage"
        );


    if(
        !name ||
        !mobile ||
        !password ||
        !password2
    ){

        message.innerHTML = `
            <div class="notice error">
                Please complete all fields.
            </div>
        `;

        return;

    }


    if(password.length !== 8){

        message.innerHTML = `
            <div class="notice error">
                Password must be exactly
                8 characters.
            </div>
        `;

        return;

    }


    if(password !== password2){

        message.innerHTML = `
            <div class="notice error">
                Passwords do not match.
            </div>
        `;

        return;

    }


    if(
        db.members.some(
            member =>
            member.mobile === mobile
        )
    ){

        message.innerHTML = `
            <div class="notice error">
                This mobile number is
                already registered.
            </div>
        `;

        return;

    }


    /*
       প্রথম account ছাড়া
       প্রত্যেক account-এর Referral ID লাগবে
    */

    if(
        db.members.length > 0 &&
        !referralID
    ){

        message.innerHTML = `
            <div class="notice error">
                Referral ID is required.
            </div>
        `;

        return;

    }


    /*
       Referral ID অবশ্যই Active Member-এর হতে হবে
    */

    if(
        referralID &&
        !getActiveMember(referralID)
    ){

        message.innerHTML = `
            <div class="notice error">
                Invalid or inactive
                Referral ID.
            </div>
        `;

        return;

    }


    /*
       নতুন unique ID
    */

    const newID =
        makeID(db.nextId++);


    const now =
        new Date();


    const newMember = {

        id:newID,

        name:name,

        mobile:mobile,

        password:password,

        uplineID:
            referralID || null,

        active:false,

        joinDate:
            now.toLocaleDateString("en-GB"),

        joinTime:
            now.toLocaleTimeString(
                "en-US",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ),

        earning:0,

        balance:0,

        packages:[],

        photo:""

    };


    db.members.push(
        newMember
    );


    /*
       Activation Request
    */

    db.requests.push({

        id:Date.now(),

        type:"ID_ACTIVATION",

        memberID:newID,

        amount:ACTIVATION_FEE,

        status:"PENDING",

        date:
            now.toLocaleString("en-BD")

    });


    saveDB();


    openActivation(
        newID
    );

}

/* =========================================================
   SUBMIT PAYMENT
========================================================= */

function submitActivation(memberID){

    const transactionID =
        document.getElementById(
            "transactionID"
        ).value.trim();


    if(!transactionID){

        alert(
            "Please enter Transaction ID."
        );

        return;

    }


    const request =
        db.requests.find(
            request =>
            request.type ===
            "ID_ACTIVATION" &&

            request.memberID ===
            memberID &&

            request.status ===
            "PENDING"
        );


    if(request){

        request.transactionID =
            transactionID;

        request.paymentMethod =
            document.querySelector(
                'input[name="paymentMethod"]:checked'
            ).value;

        request.screenshot =
            document.getElementById(
                "paymentScreenshot"
            ).files[0]?.name || "";

    }


    saveDB();

    showPending(
        memberID
    );

}

/* =========================================================
   LOGIN MEMBER
========================================================= */

function loginMember(){

    const mobile =
        document.getElementById(
            "loginMobile"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const member =
        db.members.find(
            member =>
            member.mobile === mobile &&
            member.password === password
        );


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!member){

        message.innerHTML = `
            <div class="notice error">
                Invalid mobile number
                or password.
            </div>
        `;

        return;

    }


    if(!member.active){

        message.innerHTML = `
            <div class="notice error">

                    `
                    :
                    renderNetworkRoots()
                }

function renderNetworkRoots(){

    const roots =
        db.members.filter(
            member =>
            member.active &&
            !member.uplineID
        );


    return roots
        .map(
            root =>
            renderNode(root.id)
        )
        .join("");

}


function renderNode(memberID){

    const member =
        getActiveMember(memberID);


    if(!member){
        return "";
    }


    const children =
        getDirectPartners(
            memberID
        );


    return `

        <div
            class="network"
            style="margin:20px"
        >

            <div
                class="node"
                title="${escapeHTML(member.name)}"
            >
                ${member.id}
            </div>


            ${
                children.length
                ?
                `
                <div class="children">

                    ${
                        children.map(
                            child =>
                            renderNode(child.id)
                        ).join("")
                    }

                </div>
                `
                :
                ""
            }

        </div>

    `;

}

/* =========================================================
   SUBMIT WITHDRAW
========================================================= */

function submitWithdraw(){

    const member =
        getMember(
            db.currentMember
        );


    const amount =
        Number(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    const direct =
        getDirectPartners(
            member.id
        ).length;


    const hour =
        new Date().getHours();


    if(
        hour < 22 ||
        hour >= 23
    ){

        alert(
            "Withdrawal system is open from 10:00 PM to 11:00 PM."
        );

        return;

    }


    if(direct < 10){

        alert(
            "You need 10 direct active referrals."
        );

        return;

    }


    if(
        !amount ||
        amount <= 0 ||
        amount > member.balance
    ){

        alert(
            "Invalid withdrawal amount."
        );

        return;

    }


    if(
        !document.getElementById(
            "receiverNumber"
        ).value.trim()
    ){

        alert(
            "Enter receiver number."
        );

        return;

    }


    member.balance -= amount;


    db.requests.push({

        id:Date.now(),

        type:"WITHDRAWAL",

        memberID:
            member.id,

        amount:amount,

        method:
            document.querySelector(
                'input[name="withdrawMethod"]:checked'
            ).value,

        receiver:
            document.getElementById(
                "receiverNumber"
            ).value.trim(),

        status:"PENDING",

        date:
            new Date()
            .toLocaleString("en-BD")

    });


    addNotification(

        member.id,

        "💸 WITHDRAWAL SUBMITTED",

        "Your withdrawal request has been submitted."

    );


    saveDB();

    dashboard();

}
